name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build & verify with Maven
      # 'verify' runs unit tests (surefire), builds the shaded JAR (package),
      # then the *IT integration tests (failsafe), which start a Keycloak
      # container via Testcontainers — Docker is available on the runner.
      run: mvn -B verify --file pom.xml
